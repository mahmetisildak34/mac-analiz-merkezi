name: Isolated mobile browser
on:
  push:
    branches: [feature/local-favorites-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    name: Mobile (${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    env:
      MAM_BROWSER: ${{ matrix.engine }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: App integrity and inline JavaScript checks
        run: node test/app-integrity.test.cjs
      - name: Frontend regression tests
        run: node --test tests/*.test.*
      - run: npm install --no-save --ignore-scripts playwright@1.51.1
      - run: npx playwright install --with-deps "$MAM_BROWSER"
      - name: Offline browser checks
        run: |
          mkdir -p mobile-results
          node <<'JS'
          const {chromium,webkit,devices}=require('playwright');
          const fs=require('fs');
          const http=require('http');
          const finishedSummary=JSON.parse(fs.readFileSync('tests/fixtures/espn-finished-750191.json','utf8'));
          const origin='http://127.0.0.1:4173';
          const assets=new Map([
            ['/index.html','text/html; charset=utf-8'],
            ...['half-goal-algorithm.js','trusted-goal-poisson.js','archive-poisson-client.js'].map(name=>['/'+name,'application/javascript; charset=utf-8'])
          ]);
          (async()=>{
            const engine=process.env.MAM_BROWSER;
            const browser=await {chromium,webkit}[engine].launch();
            const device=devices[engine==='webkit'?'iPhone 13':'Pixel 7'];
            const results=[];
            const server=http.createServer((request,response)=>{
              const type=assets.get(request.url);
              if(request.method!=='GET'||!type){response.writeHead(404).end();return;}
              response.writeHead(200,{'Content-Type':type}).end(fs.readFileSync(request.url.slice(1)));
            });
            await new Promise(resolve=>server.listen(4173,'127.0.0.1',resolve));
            try {
              for(const width of [320,360,375,390,414,430]){
                const context=await browser.newContext({...device,viewport:{width,height:844},isMobile:true,hasTouch:true,serviceWorkers:'block'});
                const page=await context.newPage();
                // All service calls are intercepted. Only the local asset server is reachable.
                await context.route('**/*',route=>new URL(route.request().url()).origin===origin?route.continue():route.abort());
                // Synthetic authentication only inside this offline browser context.
                await context.addInitScript(localOrigin=>{if(location.origin===localOrigin)localStorage.setItem('mam_session_token','offline-test-token');},origin);
                await context.route('https://odd-sunset-6c83.m-ahmetisildak34.workers.dev/auth/check',route=>{
                  if(route.request().method()==='OPTIONS')return route.fulfill({status:204,headers:{'access-control-allow-origin':origin,'access-control-allow-headers':'authorization','access-control-allow-methods':'GET, OPTIONS'}});
                  if(route.request().method()==='GET'&&route.request().headers().authorization==='Bearer offline-test-token')return route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':origin},body:JSON.stringify({ok:true})});
                  return route.abort();
                });
                await context.route('https://odd-sunset-6c83.m-ahmetisildak34.workers.dev/api/espn/tur.1/summary?event=750191',route=>route.fulfill({
                  status:200,contentType:'application/json',headers:{'access-control-allow-origin':origin},body:JSON.stringify(finishedSummary)
                }));
                const errors=[];
                page.on('pageerror',e=>errors.push(e.stack || e.message));
                await page.goto(origin+'/index.html',{waitUntil:'domcontentloaded'});
                await page.waitForTimeout(500);
                const metrics=await page.evaluate(()=>({viewport:innerWidth,scroll:document.documentElement.scrollWidth,title:document.title,favorites:!!document.querySelector('#mamFavoritesOpen')}));
                await page.screenshot({path:'mobile-results/'+width+'.png',fullPage:true});
                results.push({width,metrics,errors,pass:metrics.scroll<=width&&metrics.favorites&&errors.length===0});
                const checks={};
                try {
                  await page.locator('#mamAuthGate').waitFor({state:'detached',timeout:5000});
                  await page.locator('#mamFavoritesOpen').click({timeout:5000});
                  checks.dialogOpen=await page.locator('#mamFavoritesDialog').evaluate(e=>e.open);
                  await page.locator('#mamFavSearch').fill('Fenerbahçe');
                  checks.searchInput=await page.locator('#mamFavSearch').inputValue()==='Fenerbahçe';
                  await page.evaluate(()=>{
                    const make=(id,home,away)=>({fixture:{id:'espn-test-'+id,date:new Date(Date.now()+3600000).toISOString(),status:{short:'NS'}},league:{id:203,name:'Süper Lig',country:'Türkiye'},teams:{home:{id:id*10,name:home},away:{id:id*10+1,name:away}},goals:{home:null,away:null},mamSource:'espn'});
                    allMatches=[make(1,'Fenerbahçe','Beşiktaş'),make(2,'Galatasaray','Trabzonspor')];
                    mamScreenMode='home';document.getElementById('league').value='all';renderMatches();
                  });
                  checks.searchResults=await page.locator('#mamFavSearchList').innerText().then(t=>t.includes('Fenerbahçe')&&!t.includes('Galatasaray'));
                  await page.locator('#mamFavSearch').fill('besiktas');
                  checks.turkishSearch=await page.locator('#mamFavSearchList').innerText().then(t=>t.includes('Beşiktaş'));
                  await page.locator('#mamFavSelect').selectOption({label:'Takım: Fenerbahçe'});
                  await page.locator('#mamFavToggle').click();
                  checks.favoriteAdded=await page.locator('#mamFavSaved').innerText().then(t=>t.includes('Fenerbahçe'));
                  await page.locator('#mamFavSaved button[data-remove-fav]').click();
                  checks.favoriteRemoved=await page.locator('#mamFavSaved button[data-remove-fav]').count()===0;
                  await page.locator('#mamFavSearchClear').click();
                  checks.searchClear=await page.locator('#mamFavSearch').inputValue()==='';
                  await page.locator('#mamFavNotify').check();
                  checks.preferenceSaved=await page.evaluate(()=>localStorage.getItem('mam_fav_notifications_v1')==='on');
                  await page.screenshot({path:'mobile-results/'+width+'-favorites.png'});
                  await page.locator('#mamFavoritesClose').click();
                  checks.dialogClosed=await page.locator('#mamFavoritesDialog').evaluate(e=>!e.open);
                  await page.reload({waitUntil:'domcontentloaded'});
                  checks.preferenceRestored=await page.locator('#mamFavNotify').isChecked();
                  Object.assign(checks,await page.evaluate(()=>{
                    const m=(a,b,status="FT",home="A",away="B",date="2025-01-01T12:00:00Z")=>({fixture:{date,status:{short:status}},league:{id:1},teams:{home:{name:home},away:{name:away}},goals:{home:a,away:b}});
                    const match=n=>n==="A", rows=x=>window.mamTeamHistoryRows(x,match);
                    const good=rows([m(0,0)]);
                    const profileRows=rows([m(2,0,"FT","A","B","2025-01-05T12:00:00Z"),m(1,1,"FT","A","B","2025-01-04T12:00:00Z"),m(0,1,"FT","A","B","2025-01-03T12:00:00Z"),m(0,0,"FT","B","A","2025-01-02T12:00:00Z"),m(3,1,"FT","A","B","2025-01-01T12:00:00Z")]);const profile=window.mamTeamHistorySummary(profileRows);const home=window.mamTeamHistorySummary(profileRows,"home"),away=window.mamTeamHistorySummary(profileRows,"away");return {historyZero:good.length===1,historyMissing:rows([m(null,0)]).length===0,historyLive:rows([m(1,0,"2H")]).length===0,historyConflict:rows([m(1,0),m(2,0)]).length===0,historyUnrelated:rows([m(1,0,"FT","C","B")]).length===0,historyAway:window.mamTeamHistorySummary(rows([m(1,2,"FT","B","A")]),"away").w===1,profileSamples:profile.n===5&&profile.w===2&&profile.d===2&&profile.l===1,profileAverages:profile.avgFor===1.2&&profile.avgAgainst===0.6,profilePoints:profile.points===8&&profile.cleanSheets===2&&profile.failedToScore===2,profileForm:profile.form.join("")==="wdldw"&&profile.streak===1,profileVenueSplit:home.n===4&&home.points===7&&away.n===1&&away.d===1};
                  }));

                  Object.assign(checks,await page.evaluate(()=>{
                    const rows=Array.from({length:10},()=>({goals:{home:2,away:1},mamSelectedTeamHome:true}));
                    const record=window.mamTeamHistorySummary(rows,"home",10);
                    const rejected=window.mamTeamHistoryRows([{
                      fixture:{date:"2025-01-01T12:00:00Z",status:{short:"FT"}},
                      teams:{home:{name:"A"},away:{name:"B"}},goals:{home:2,away:0},score_verified:false
                    }],name=>name==="A");
                    return {profileTen:record.form.length===10&&record.points===30,profileRejectsUnverified:rejected.length===0};
                  }));

                  Object.assign(checks,await page.evaluate(()=>({
                    standingMissing:mamStandingCell(null)==='—'&&mamStandingCell('')==='—',
                    standingZero:mamStandingCell(0)===0,
                    standingDifferenceMissing:mamStandingDifference(null,2)==='—',
                    standingDifferenceNegative:mamStandingDifference(2,4)===-2,
                    standingForm:mamStandingForm('WWDLW')==='WWDLW',
                    standingFormMissing:mamStandingForm(null)===''
                  })));

                  Object.assign(checks,await page.evaluate(()=>({
                    eventGoal:mamEventType('Goal','Normal Goal')==='Gol',
                    eventYellow:mamEventType('Card','Yellow Card')==='Sarı kart',
                    eventRed:mamEventType('Card','Red Card')==='Kırmızı kart',
                    eventSubstitution:mamEventType('subst')==='Oyuncu değişikliği',
                    eventMissed:mamEventType('Goal','Missed Penalty')===null,
                    eventOrder:mamEventOrder("45+1'")<mamEventOrder("45+3'")&&mamEventOrder("45+3'")<mamEventOrder("46'")&&mamEventOrder("")===Infinity
                  })));

                  Object.assign(checks,await page.evaluate(()=>{
                    const team={formation:'4-4-2',startXI:[1,4,4,2].flatMap((n,i)=>Array.from({length:n},(_,j)=>({player:{grid:(i+1)+':'+(j+1),name:'Test oyuncusu'}}))),substitutes:[{player:{name:'Test yedek'}}]};
                    const rows=mamVerifiedLineupRows(team);
                    const missing={...team,formation:''};
                    const duplicate={...team,startXI:team.startXI.map((x,i)=>i===1?team.startXI[0]:x)};
                    return {lineupGrid:rows?.map(x=>x.length).join(',')==='1,4,4,2',lineupMissing:mamVerifiedLineupRows(missing)===null,lineupIncomplete:mamVerifiedLineupRows({...team,startXI:team.startXI.slice(1)})===null,lineupDuplicate:mamVerifiedLineupRows(duplicate)===null,lineupFallback:lineupTeamHTML(missing,new Map(),0).includes('mam-lineup-list'),lineupBench:lineupTeamHTML(missing,new Map(),0).includes('Test yedek')};
                  }));

                  Object.assign(checks,await page.evaluate(()=>({
                    statMissing:mamStatNumber(null)===null&&mamStatNumber('')===null,
                    statZero:mamStatNumber('0')===0,
                    statDecimal:mamStatNumber('54,5%')===54.5,
                    statMissingTrack:!mamLiveStatRows([['Şut',null,3]]).includes('width:'),
                    statZeroTrack:!mamLiveStatRows([['Şut',0,0]]).includes('width:'),
                    statRatio:mamLiveStatRows([['Şut',3,1]]).includes('width:75%')
                  })));

                  Object.assign(checks,await page.evaluate(()=>{
                    const article=document.createElement('article');
                    article.innerHTML='<div class="match-versus"></div><div class="match-actions"><button class="lineupBtn">Kadro</button></div><div class="lineup-panel">Test kadrosu</div><button class="liveStatsBtn">İstatistik</button>';
                    document.body.append(article);
                    try {
                      makeMamDetailTab(article);
                      const tabs=article.querySelectorAll('[role="tab"]');
                      const lineup=article.querySelector('.match-detail-pane[data-pane="lineup"]');
                      const stats=article.querySelector('.match-detail-pane[data-pane="stats"]');
                      article.querySelector('.match-detail-tab[data-pane="overview"]').click();
                      return {detailTabs:tabs.length===7,detailSelected:article.querySelectorAll('[aria-selected="true"]').length===1,lineupPreserved:!!lineup.querySelector('.lineupBtn')&&!!lineup.querySelector('.lineup-panel'),statsPreserved:!!stats.querySelector('.liveStatsBtn'),detailPaneVisibility:!article.querySelector('.match-detail-pane[data-pane="overview"]').hidden&&lineup.hidden&&stats.hidden};
                    } finally {article.remove();}
                  }));

                  Object.assign(checks,await page.evaluate(()=>{
                    const match=(status,date)=>({fixture:{status:{short:status},date}});
                    const now=Date.parse('2026-11-21T20:00:00Z');
                    const old={at:now,status:'1H',home:0,away:0};
                    const events=(status,home,away,at=now+1000)=>mamNotificationStep(old,{status,home,away,at});
                    return {
                      istanbulMidnight:mamIstanbulDateString(new Date('2026-11-21T21:00:00Z'))==='2026-11-22',
                      activeStatuses:['1H','HT','2H','ET','BT','P','LIVE'].every(s=>mamIsActiveMatch(match(s))),
                      inactiveStatuses:['NS','FT','PST','CANC','SUSP','INT'].every(s=>!mamIsActiveMatch(match(s))),
                      futureFilter:mamIsFutureUnplayed(match('NS','2026-11-21T21:00:00Z'),now)&&!mamIsFutureUnplayed(match('NS','2026-11-21T19:00:00Z'),now),
                      goalEvent:events('1H',1,0).includes('⚽ Gol'),
                      noRepeatGoal:events('1H',0,0).length===0,
                      halfTimeEvent:events('HT',0,0).includes('Devre arası'),
                      finalEvent:events('FT',0,0).includes('Maç sona erdi'),
                      staleEvent:events('1H',1,0,now+400000).length===0
                    };
                  }));

                  for(const mode of ['today','live','finished','upcoming','standings']){
                    const navigation=mode==='standings'?'[data-mam-bottom="standings"]':'[data-mam-action="'+mode+'"]';
                    await page.locator(navigation).click({timeout:5000});
                    await page.locator('main.mam-screen-'+mode).waitFor({state:'visible',timeout:5000});
                    checks['screen_'+mode]=await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth);
                    await page.screenshot({path:'mobile-results/'+width+'-'+mode+'.png'});
                    await page.locator('#mamSectionBack').click({timeout:5000});
                    await page.locator('main.mam-screen-home').waitFor({state:'visible',timeout:5000});
                  }
                  checks.backHome=await page.locator('main.mam-screen-home').isVisible();
                  const oldDate=await page.locator('#date').inputValue();
                  await page.locator('[data-day-offset="1"]').click({timeout:5000});
                  checks.dateChanged=oldDate!==(await page.locator('#date').inputValue());
                  const nav=await page.locator('.mam-bottom-nav').boundingBox();
                  checks.navigationWithinViewport=Boolean(nav&&nav.x>=0&&nav.x+nav.width<=width+1&&nav.y>=0&&nav.y+nav.height<=845);
                  await page.locator('[data-mam-action="finished"]').click({timeout:5000});
                  await page.waitForFunction(()=>!window.mamLoadMatchesBusy);
                  await page.evaluate(summary=>{
                    const event=summary.header.competitions[0];
                    const teams=Object.fromEntries(event.competitors.map(row=>[row.homeAway,{id:row.team.id,name:row.team.displayName}]));
                    const goals=Object.fromEntries(event.competitors.map(row=>[row.homeAway,Number(row.score)]));
                    allMatches=[{fixture:{id:'espn-tur.1-'+event.id,date:event.date,status:{short:'FT'}},
                      league:{id:203,name:'Süper Lig',country:'Türkiye'},teams,goals}];
                    renderMatches();
                  },finishedSummary);
                  await page.locator('#matches .mam-match-open').click({timeout:5000});
                  const detail=page.locator('.match-detail-overlay');
                  await detail.waitFor({state:'visible',timeout:5000});
                  checks.finishedDetail=await detail.locator('[data-pane="overview"][role="tabpanel"]').isVisible();
                  await page.screenshot({path:'mobile-results/'+width+'-match-detail.png'});
                  await detail.locator('[data-pane="stats"][role="tab"]').click({timeout:5000});
                  await detail.getByText('Toplam şut',{exact:true}).waitFor({state:'visible',timeout:7000});
                  const stats=await detail.locator('.liveStats').innerText();
                  checks.finishedProviderStats=stats.includes('21')&&stats.includes('Kaynak: ESPN')&&!stats.includes('Model xG');
                  await page.screenshot({path:'mobile-results/'+width+'-match-statistics.png'});
                  await detail.locator('.match-detail-close').click({timeout:5000});
                  checks.matchDetailBack=await detail.isHidden()&&await page.locator('#matches .mam-match-open').isVisible();
                } catch(e){errors.push(e.stack||e.message);}
                Object.assign(results[results.length-1],{checks,pass:results[results.length-1].pass&&Object.keys(checks).length===72&&Object.values(checks).every(Boolean)&&errors.length===0});
                await context.close();
              }
            } finally {await browser.close();server.close();fs.writeFileSync('mobile-results/results.json',JSON.stringify(results,null,2));for(const result of results)console.log(JSON.stringify(result,null,2));}
            if(results.length!==6||results.some(r=>!r.pass))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-mobile-results-${{ matrix.engine }}
          path: mobile-results/

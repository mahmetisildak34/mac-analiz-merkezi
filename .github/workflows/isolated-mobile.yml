name: Isolated mobile browser
on:
  push:
    branches: [feature/local-favorites-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --ignore-scripts playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Offline browser checks
        run: |
          mkdir -p mobile-results
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch();
            const results=[];
            try {
              for(const width of [320,360,375,390,414,430]){
                const context=await browser.newContext({viewport:{width,height:844},isMobile:true,hasTouch:true,serviceWorkers:'block',offline:true});
                const page=await context.newPage();
                await context.route('**/*',async route=>{
                  const url=new URL(route.request().url());
                  const local={'/index.html':['index.html','text/html; charset=utf-8'],'/half-goal-algorithm.js':['half-goal-algorithm.js','application/javascript; charset=utf-8']};
                  const asset=local[url.pathname];
                  if(url.origin==='https://mam-test.invalid'&&route.request().method()==='GET'&&!url.search&&asset){
                    return route.fulfill({status:200,contentType:asset[1],body:fs.readFileSync(asset[0],'utf8')});
                  }
                  return route.abort();
                });
                const errors=[];
                page.on('pageerror',e=>errors.push(e.stack || e.message));
                await page.goto('https://mam-test.invalid/index.html',{waitUntil:'domcontentloaded'});
                await page.waitForTimeout(500);
                const metrics=await page.evaluate(()=>({viewport:innerWidth,scroll:document.documentElement.scrollWidth,title:document.title,favorites:!!document.querySelector('#mamFavoritesOpen')}));
                await page.screenshot({path:'mobile-results/'+width+'.png',fullPage:true});
                results.push({width,metrics,errors,pass:metrics.scroll<=width&&metrics.favorites&&errors.length===0});
                await context.close();
              }
            } finally {await browser.close();fs.writeFileSync('mobile-results/results.json',JSON.stringify(results,null,2));for(const result of results)console.log(JSON.stringify(result,null,2));}
            if(results.length!==6||results.some(r=>!r.pass))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-mobile-results
          path: mobile-results/

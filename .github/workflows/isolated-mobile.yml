name: Isolated mobile browser
on:
  push:
    branches: [feature/local-favorites-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --ignore-scripts playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Offline browser checks
        run: |
          mkdir -p mobile-results
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch();
            const results=[];
            try {
              for(const width of [320,360,375,390,414,430]){
                const context=await browser.newContext({viewport:{width,height:844},isMobile:true,hasTouch:true,serviceWorkers:'block',offline:true});
                const page=await context.newPage();
                await context.route('**/*',async route=>{
                  const url=new URL(route.request().url());
                  const local={'/index.html':['index.html','text/html; charset=utf-8'],'/half-goal-algorithm.js':['half-goal-algorithm.js','application/javascript; charset=utf-8']};
                  const asset=local[url.pathname];
                  if(url.origin==='https://mam-test.invalid'&&route.request().method()==='GET'&&!url.search&&asset){
                    return route.fulfill({status:200,contentType:asset[1],body:fs.readFileSync(asset[0],'utf8')});
                  }
                  return route.abort();
                });
                // Synthetic authentication only inside this offline browser context.
                await context.addInitScript(()=>{if(location.origin==='https://mam-test.invalid')localStorage.setItem('mam_session_token','offline-test-token');});
                await context.route('https://odd-sunset-6c83.m-ahmetisildak34.workers.dev/auth/check',route=>{
                  if(route.request().method()==='OPTIONS')return route.fulfill({status:204,headers:{'access-control-allow-origin':'https://mam-test.invalid','access-control-allow-headers':'authorization','access-control-allow-methods':'GET, OPTIONS'}});
                  if(route.request().method()==='GET'&&route.request().headers().authorization==='Bearer offline-test-token')return route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'https://mam-test.invalid'},body:JSON.stringify({ok:true})});
                  return route.abort();
                });
                const errors=[];
                page.on('pageerror',e=>errors.push(e.stack || e.message));
                await page.goto('https://mam-test.invalid/index.html',{waitUntil:'domcontentloaded'});
                await page.waitForTimeout(500);
                const metrics=await page.evaluate(()=>({viewport:innerWidth,scroll:document.documentElement.scrollWidth,title:document.title,favorites:!!document.querySelector('#mamFavoritesOpen')}));
                await page.screenshot({path:'mobile-results/'+width+'.png',fullPage:true});
                results.push({width,metrics,errors,pass:metrics.scroll<=width&&metrics.favorites&&errors.length===0});
                const checks={};
                try {
                  await page.locator('#mamAuthGate').waitFor({state:'detached',timeout:5000});
                  await page.locator('#mamFavoritesOpen').click({timeout:5000});
                  checks.dialogOpen=await page.locator('#mamFavoritesDialog').evaluate(e=>e.open);
                  await page.locator('#mamFavSearch').fill('Fenerbahçe');
                  checks.searchInput=await page.locator('#mamFavSearch').inputValue()==='Fenerbahçe';
                  await page.locator('#mamFavSearchClear').click();
                  checks.searchClear=await page.locator('#mamFavSearch').inputValue()==='';
                  await page.locator('#mamFavNotify').check();
                  checks.preferenceSaved=await page.evaluate(()=>localStorage.getItem('mam_fav_notifications_v1')==='on');
                  await page.screenshot({path:'mobile-results/'+width+'-favorites.png'});
                  await page.locator('#mamFavoritesClose').click();
                  checks.dialogClosed=await page.locator('#mamFavoritesDialog').evaluate(e=>!e.open);
                  await page.reload({waitUntil:'domcontentloaded'});
                  checks.preferenceRestored=await page.locator('#mamFavNotify').isChecked();
                } catch(e){errors.push(e.stack||e.message);}
                Object.assign(results[results.length-1],{checks,pass:results[results.length-1].pass&&Object.keys(checks).length===6&&Object.values(checks).every(Boolean)&&errors.length===0});
                await context.close();
              }
            } finally {await browser.close();fs.writeFileSync('mobile-results/results.json',JSON.stringify(results,null,2));for(const result of results)console.log(JSON.stringify(result,null,2));}
            if(results.length!==6||results.some(r=>!r.pass))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-mobile-results
          path: mobile-results/

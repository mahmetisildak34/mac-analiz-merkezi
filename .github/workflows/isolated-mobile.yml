name: Isolated mobile browser
on:
  push:
    branches: [feature/local-favorites-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --ignore-scripts playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Offline browser checks
        run: |
          mkdir -p mobile-results
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch();
            const results=[];
            try {
              for(const width of [320,360,375,390,414,430]){
                const context=await browser.newContext({viewport:{width,height:844},isMobile:true,hasTouch:true,serviceWorkers:'block',offline:true});
                const page=await context.newPage();
                await context.route('**/*',async route=>{
                  const url=new URL(route.request().url());
                  const local={'/index.html':['index.html','text/html; charset=utf-8'],'/half-goal-algorithm.js':['half-goal-algorithm.js','application/javascript; charset=utf-8']};
                  const asset=local[url.pathname];
                  if(url.origin==='https://mam-test.invalid'&&route.request().method()==='GET'&&!url.search&&asset){
                    return route.fulfill({status:200,contentType:asset[1],body:fs.readFileSync(asset[0],'utf8')});
                  }
                  return route.abort();
                });
                // Synthetic authentication only inside this offline browser context.
                await context.addInitScript(()=>{if(location.origin==='https://mam-test.invalid')localStorage.setItem('mam_session_token','offline-test-token');});
                await context.route('https://odd-sunset-6c83.m-ahmetisildak34.workers.dev/auth/check',route=>{
                  if(route.request().method()==='OPTIONS')return route.fulfill({status:204,headers:{'access-control-allow-origin':'https://mam-test.invalid','access-control-allow-headers':'authorization','access-control-allow-methods':'GET, OPTIONS'}});
                  if(route.request().method()==='GET'&&route.request().headers().authorization==='Bearer offline-test-token')return route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'https://mam-test.invalid'},body:JSON.stringify({ok:true})});
                  return route.abort();
                });
                const errors=[];
                page.on('pageerror',e=>errors.push(e.stack || e.message));
                await page.goto('https://mam-test.invalid/index.html',{waitUntil:'domcontentloaded'});
                await page.waitForTimeout(500);
                const metrics=await page.evaluate(()=>({viewport:innerWidth,scroll:document.documentElement.scrollWidth,title:document.title,favorites:!!document.querySelector('#mamFavoritesOpen')}));
                await page.screenshot({path:'mobile-results/'+width+'.png',fullPage:true});
                results.push({width,metrics,errors,pass:metrics.scroll<=width&&metrics.favorites&&errors.length===0});
                const checks={};
                try {
                  await page.locator('#mamAuthGate').waitFor({state:'detached',timeout:5000});
                  await page.locator('#mamFavoritesOpen').click({timeout:5000});
                  checks.dialogOpen=await page.locator('#mamFavoritesDialog').evaluate(e=>e.open);
                  await page.locator('#mamFavSearch').fill('Fenerbahçe');
                  checks.searchInput=await page.locator('#mamFavSearch').inputValue()==='Fenerbahçe';
                  await page.evaluate(()=>{
                    const make=(id,home,away)=>({fixture:{id:'espn-test-'+id,date:new Date(Date.now()+3600000).toISOString(),status:{short:'NS'}},league:{id:203,name:'Süper Lig',country:'Türkiye'},teams:{home:{id:id*10,name:home},away:{id:id*10+1,name:away}},goals:{home:null,away:null},mamSource:'espn'});
                    allMatches=[make(1,'Fenerbahçe','Beşiktaş'),make(2,'Galatasaray','Trabzonspor')];
                    mamScreenMode='home';document.getElementById('league').value='all';renderMatches();
                  });
                  checks.searchResults=await page.locator('#mamFavSearchList').innerText().then(t=>t.includes('Fenerbahçe')&&!t.includes('Galatasaray'));
                  await page.locator('#mamFavSearch').fill('besiktas');
                  checks.turkishSearch=await page.locator('#mamFavSearchList').innerText().then(t=>t.includes('Beşiktaş'));
                  await page.locator('#mamFavSelect').selectOption({label:'Takım: Fenerbahçe'});
                  await page.locator('#mamFavToggle').click();
                  checks.favoriteAdded=await page.locator('#mamFavSaved').innerText().then(t=>t.includes('Fenerbahçe'));
                  await page.locator('#mamFavSaved button[data-remove-fav]').click();
                  checks.favoriteRemoved=await page.locator('#mamFavSaved button[data-remove-fav]').count()===0;
                  await page.locator('#mamFavSearchClear').click();
                  checks.searchClear=await page.locator('#mamFavSearch').inputValue()==='';
                  await page.locator('#mamFavNotify').check();
                  checks.preferenceSaved=await page.evaluate(()=>localStorage.getItem('mam_fav_notifications_v1')==='on');
                  await page.screenshot({path:'mobile-results/'+width+'-favorites.png'});
                  await page.locator('#mamFavoritesClose').click();
                  checks.dialogClosed=await page.locator('#mamFavoritesDialog').evaluate(e=>!e.open);
                  await page.reload({waitUntil:'domcontentloaded'});
                  checks.preferenceRestored=await page.locator('#mamFavNotify').isChecked();
                  Object.assign(checks,await page.evaluate(()=>({
                    statMissing:mamStatNumber(null)===null&&mamStatNumber('')===null,
                    statZero:mamStatNumber('0')===0,
                    statDecimal:mamStatNumber('54,5%')===54.5,
                    statMissingTrack:!mamLiveStatRows([['Şut',null,3]]).includes('width:'),
                    statZeroTrack:!mamLiveStatRows([['Şut',0,0]]).includes('width:'),
                    statRatio:mamLiveStatRows([['Şut',3,1]]).includes('width:75%')
                  })));

                  Object.assign(checks,await page.evaluate(()=>{
                    const article=document.createElement('article');
                    article.innerHTML='<div class="match-versus"></div><div class="match-actions"><button class="lineupBtn">Kadro</button></div><div class="lineup-panel">Test kadrosu</div><button class="liveStatsBtn">İstatistik</button>';
                    document.body.append(article);
                    try {
                      makeMamDetailTab(article);
                      const tabs=article.querySelectorAll('[role="tab"]');
                      const lineup=article.querySelector('.match-detail-pane[data-pane="lineup"]');
                      const stats=article.querySelector('.match-detail-pane[data-pane="stats"]');
                      article.querySelector('.match-detail-tab[data-pane="overview"]').click();
                      return {detailTabs:tabs.length===7,detailSelected:article.querySelectorAll('[aria-selected="true"]').length===1,lineupPreserved:!!lineup.querySelector('.lineupBtn')&&!!lineup.querySelector('.lineup-panel'),statsPreserved:!!stats.querySelector('.liveStatsBtn'),detailPaneVisibility:!article.querySelector('.match-detail-pane[data-pane="overview"]').hidden&&lineup.hidden&&stats.hidden};
                    } finally {article.remove();}
                  }));

                  Object.assign(checks,await page.evaluate(()=>{
                    const match=(status,date)=>({fixture:{status:{short:status},date}});
                    const now=Date.parse('2026-11-21T20:00:00Z');
                    const old={at:now,status:'1H',home:0,away:0};
                    const events=(status,home,away,at=now+1000)=>mamNotificationStep(old,{status,home,away,at});
                    return {
                      istanbulMidnight:mamIstanbulDateString(new Date('2026-11-21T21:00:00Z'))==='2026-11-22',
                      activeStatuses:['1H','HT','2H','ET','BT','P','LIVE'].every(s=>mamIsActiveMatch(match(s))),
                      inactiveStatuses:['NS','FT','PST','CANC','SUSP','INT'].every(s=>!mamIsActiveMatch(match(s))),
                      futureFilter:mamIsFutureUnplayed(match('NS','2026-11-21T21:00:00Z'),now)&&!mamIsFutureUnplayed(match('NS','2026-11-21T19:00:00Z'),now),
                      goalEvent:events('1H',1,0).includes('⚽ Gol'),
                      noRepeatGoal:events('1H',0,0).length===0,
                      halfTimeEvent:events('HT',0,0).includes('Devre arası'),
                      finalEvent:events('FT',0,0).includes('Maç sona erdi'),
                      staleEvent:events('1H',1,0,now+400000).length===0
                    };
                  }));

                } catch(e){errors.push(e.stack||e.message);}
                Object.assign(results[results.length-1],{checks,pass:results[results.length-1].pass&&Object.keys(checks).length===30&&Object.values(checks).every(Boolean)&&errors.length===0});
                await context.close();
              }
            } finally {await browser.close();fs.writeFileSync('mobile-results/results.json',JSON.stringify(results,null,2));for(const result of results)console.log(JSON.stringify(result,null,2));}
            if(results.length!==6||results.some(r=>!r.pass))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-mobile-results
          path: mobile-results/

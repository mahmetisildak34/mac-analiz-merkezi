name: Independent product hub regression
on:
  push:
    branches:
      - feature/independent-product-features-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check product module syntax
        run: node --check mobile/product-features.mjs
      - name: Run independent product regression
        run: node --test tests/product-hub-integration.test.mjs

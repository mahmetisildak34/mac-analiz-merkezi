name: Advanced match details acceptance
on:
  push:
    branches: [feature/advanced-match-details-20261123]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  details-node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check ESPN detail module
        run: |
          node --check mobile/espn-match-details.mjs
          node --test tests/espn-match-details.test.mjs tests/advanced-espn-overlay.test.mjs tests/match-card-visibility-regression.test.mjs tests/match-card-interaction.test.mjs tests/live-fixture-preservation.test.mjs tests/global-history-root-cause.test.mjs
  details-browser-regression:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright runner
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Run existing premium mobile acceptance
        run: node --test tests/premium-dark-browser.test.cjs tests/product-mobile-browser.test.mjs
      - name: Verify main application cards across three iPhone viewports
        run: node --test tests/iphone-match-cards.test.mjs
      - name: Verify repeated Service Worker update reload in Chromium and WebKit
        run: node --test tests/service-worker-update-browser.test.mjs

      - name: Verify real ESPN read-only fixtures in Chromium and WebKit
        run: node --test tests/real-espn-browser.test.mjs

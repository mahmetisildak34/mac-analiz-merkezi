name: Premium dark mobile visual acceptance
on:
  push:
    branches:
      - feature/premium-dark-red-iphone-20261123
  workflow_dispatch:
jobs:
  premium-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate theme source and existing screens
        run: node tests/premium-dark-mobile.test.cjs
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Run Chromium and WebKit iPhone visual smoke
        run: node tests/premium-dark-browser.test.cjs

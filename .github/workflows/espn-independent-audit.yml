name: Independent ESPN regression tests
on:
  push:
    branches:
      - feature/independent-espn-data-audit-20261122
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/espn-scoreboard-coverage-audit.mjs'
      - 'tests/espn-*.test.cjs'
      - 'tests/safari2-*.test.mjs'
      - 'tests/fixtures/espn-tur1-20261122.json'
      - 'tests/fixtures/safari2-favorites-harness.html'
      - 'tests/browser/safari2-mobile.spec.cjs'
      - 'playwright.safari2.config.cjs'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'safari2-favorites-search.js'
      - '.github/workflows/espn-independent-audit.yml'
permissions:
  contents: read
jobs:
  espn-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ESPN status and match-list regression tests
        run: node --test tests/espn-status-classification.test.cjs tests/espn-match-list.test.cjs tests/espn-archive-merge.test.cjs tests/espn-upcoming-status.test.cjs
      - name: Mobile and PWA Node regressions
        run: node --test tests/safari2-*.test.mjs

  browser-acceptance:
    if: github.event_name != 'pull_request' || github.head_ref == 'feature/independent-espn-data-audit-20261122' || github.head_ref == 'fix/league-upcoming-espn-status-20261122' || github.head_ref == 'fix/espn-unknown-status-coverage-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser testing tools
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Verify mobile, favorites, and offline PWA
        run: npx playwright test --config=playwright.safari2.config.cjs

  live-espn-coverage:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/espn-unknown-status-coverage-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit configured ESPN leagues read-only
        run: node scripts/espn-scoreboard-coverage-audit.mjs 2026-11-22
      - name: Upload raw coverage evidence even on blocked requests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-coverage-audit-20261122
          path: audit/espn-coverage-2026-11-22.json
          if-no-files-found: warn
          retention-days: 7

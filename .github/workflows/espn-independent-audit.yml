name: Independent ESPN regression tests
on:
  push:
    branches:
      - feature/independent-espn-data-audit-20261122
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/espn-*.test.cjs'
      - 'tests/safari2-*.test.mjs'
      - 'tests/fixtures/espn-tur1-20261122.json'
      - '.github/workflows/espn-independent-audit.yml'
permissions:
  contents: read
jobs:
  espn-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ESPN status and match-list regression tests
        run: node --test tests/espn-status-classification.test.cjs tests/espn-match-list.test.cjs tests/espn-archive-merge.test.cjs
      - name: Mobile and PWA Node regressions
        run: node --test tests/safari2-*.test.mjs

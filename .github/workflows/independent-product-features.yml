name: Independent product feature regression
on:
  push:
    branches:
      - feature/independent-product-features-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product-features:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run independent product regression tests
        run: node --test tests/product-features.test.mjs tests/product-hub-integration.test.mjs tests/main-favorites-integration.test.mjs
      - name: Validate product module syntax
        run: node --check mobile/product-features.mjs && node --check mobile/main-favorites.mjs

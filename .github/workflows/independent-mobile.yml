name: Independent PWA and native verification
on:
  push:
    branches: [feature/independent-pwa-expo]
permissions:
  contents: read
jobs:
  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node test/app-integrity.test.cjs
      - run: node --test test/pwa.test.cjs
      - run: node --test mobile/match-source.test.mjs
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install expo prebuild --platform android --no-install
        env:
          CI: 'true'
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: mobile/android
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install expo prebuild --platform ios --no-install
        env:
          CI: 'true'
      - run: pod install
        working-directory: mobile/ios
      - name: Build unsigned simulator app
        working-directory: mobile/ios
        shell: bash
        run: |
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

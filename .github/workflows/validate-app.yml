name: Validate app JavaScript

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "mam-cache-manager.js"
      - ".github/workflows/validate-app.yml"
      - "half-goal-algorithm.js"
      - "tests/half-goal-algorithm.test.js"
      - "tests/cache-sweep.test.mjs"
  pull_request:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "index.html"
      - "mam-cache-manager.js"
      - ".github/workflows/validate-app.yml"
      - "half-goal-algorithm.js"
      - "tests/half-goal-algorithm.test.js"
      - "tests/cache-sweep.test.mjs"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract inline JavaScript and validate syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b([^>]*)>(.*?)</script>", source, re.I | re.S)
          count = 0
          for attrs, body in scripts:
              if re.search(r"\bsrc\s*=", attrs, re.I):
                  continue
              kind = re.search(r"""\btype\s*=\s*["']([^"']+)["']""", attrs, re.I)
              if kind and kind.group(1).lower() not in ("text/javascript", "application/javascript", "module"):
                  continue
              if not body.strip():
                  continue
              count += 1
              Path(f"/tmp/app-inline-{count}.js").write_text(body, encoding="utf-8")
          if count == 0:
              raise SystemExit("No inline JavaScript blocks found")
          print(f"Extracted {count} inline JavaScript blocks")
          PY
          for file in /tmp/app-inline-*.js; do
            node --check "$file"
          done
      - name: Run half-goal algorithm regression tests
        run: node --test tests/*.test.js
      - name: Run user-data-preserving cache sweep regression
        run: node --test tests/cache-sweep.test.mjs
      - name: Run Poisson v1.2 golden regression
        run: node --test tests/poisson-v12-golden.test.mjs
      - name: Install Chromium and WebKit for browser regressions
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Run real fixture identity and live preservation regression tests
        run: node --test tests/live-fixture-preservation.test.mjs tests/targeted-data-layer-repair.test.mjs tests/iphone-team-history-analysis.test.mjs tests/team-history-request-timeout.test.mjs tests/d1-conflicting-score-filter.test.mjs tests/selected-date-filter.test.mjs tests/uefa-history-regression.test.mjs

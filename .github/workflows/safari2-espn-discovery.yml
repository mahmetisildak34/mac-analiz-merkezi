name: Safari 2 ESPN league discovery (read-only)
on:
  push:
    branches: [feature/safari2-mobile-ux-20261122]
    paths:
      - scripts/safari2-espn-discovery.mjs
      - .github/workflows/safari2-espn-discovery.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Probe candidate ESPN competitions (public GET)
        run: node scripts/safari2-espn-discovery.mjs
      - name: Preserve raw provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari2-espn-discovery-evidence
          path: |
            safari2-espn-discovery.json
            safari2-espn-discovery-raw
          if-no-files-found: warn
          retention-days: 7
